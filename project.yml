name: Botik
options:
  bundleIdPrefix: com.botik
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Botik:
    type: application
    platform: iOS
    sources:
      - Botik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.botik.app
        PRODUCT_NAME: Botik
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Botik/Info.plist
      properties:
        CFBundleDisplayName: Botik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: Чтобы прикреплять фото к сообщениям.
        NSPhotoLibraryAddUsageDescription: Чтобы сохранять картинки из чата.
        NSCameraUsageDescription: Чтобы сфотографировать и отправить снимок нейросети.
        NSLocalNetworkUsageDescription: Чтобы подключаться к нейросети на вашем компьютере (Ollama, LM Studio) в локальной сети.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    scheme: {}
